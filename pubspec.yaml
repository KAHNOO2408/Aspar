name: aspar_library
description: "کتابخانه‌ی آفلاین برنامه‌نویسی آسپار — جستجوی فارسی، راهنما و نصب کتابخانه‌ها بدون اینترنت"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

# عمداً هیچ پکیج خارجی ندارد تا بدون اینترنت بیلد شود.
dependencies:
  flutter:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/catalog.json
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
